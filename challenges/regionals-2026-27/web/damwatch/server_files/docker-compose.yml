services:
  damwatch:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${DAMWATCH_ENV_FILE:?Set DAMWATCH_ENV_FILE to a private env file outside the challenge folder}
        required: true
    ports:
      - "127.0.0.1:${DAMWATCH_HOST_PORT:-18027}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.5
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
