input {
  tcp { host => "0.0.0.0" port => 5000 codec => line type => "csv_dissect" }
  tcp { host => "0.0.0.0" port => 5001 codec => json type => "json" }
  tcp { host => "0.0.0.0" port => 5002 codec => line type => "csv_ruby" }
}
filter {
  if [type] == "csv_dissect" {
    dissect {
      mapping => {
        "message" => "%{batchid},%{timestamp},%{lastname},%{firstname},%{loglength},%{logdiameter},%{numberoflogs},%{volume},%{timbertype}"
      }
      convert_datatype => {
        "loglength" => "int"
        "logdiameter" => "int"
        "numberoflogs" => "int"
        "volume" => "int"
      }
      tag_on_failure => ["_dissectfailure"]
    }
  } else if [type] == "csv_ruby" {
    ruby { path => "/opt/elk/logstash/csv_parser.rb" }
  }
}
output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "logs-unified"
    ilm_enabled => false
  }
}
