services:
  elk:
    build:
      context: .
      args:
        ELASTIC_VERSION: 7.17.29
    image: log-monitor
    platform: linux/amd64
    init: true
    restart: unless-stopped
    mem_limit: 4g
    environment:
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "5601:5601"
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
    volumes:
      - es-data:/var/lib/elasticsearch
      - ./config/elasticsearch.yml:/opt/elk/elasticsearch/config/elasticsearch.yml:ro
      - ./config/kibana.yml:/opt/elk/kibana/config/kibana.yml:ro
      - ./logstash/pipeline.conf:/opt/elk/logstash/pipeline.conf:ro
      - ./logstash/csv_parser.rb:/opt/elk/logstash/csv_parser.rb:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null && curl -fsS http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
volumes:
  es-data:
