on:
  workflow_dispatch:
    inputs:
      app-version:
        type: string
        description: Application version
        required: true

env:
  FLAG: ${{ secrets.FLAG_1 }}
  OWNER: BeaverWorks
  SERVER_URL: ${{ github.SERVER_URL }}

jobs:
  build-and-publish:
    runs-on: debian
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git jq

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install PNPM
        uses: pnpm/setup@v1
        with:
          runtime: node@24

      - name: Substitute version
        run: |
          set -e
          jq --arg version "${{ inputs.app-version }}" '.version=$version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Set PNPM publish config
        env:
          AUTH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          pnpm config set registry "$SERVER_URL/api/packages/$OWNER/npm/"
          pnpm config set "//forgejo:3000/api/packages/$OWNER/npm/:_authToken=$AUTH_TOKEN"

      - name: Publish
        run: pnpm publish "--registry=$SERVER_URL/api/packages/$OWNER/npm/" --no-git-checks
