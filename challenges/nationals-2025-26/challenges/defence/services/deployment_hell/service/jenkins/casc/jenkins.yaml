    forceSandbox: false
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

tool:
  git:
    installations:
      - home: "git"
        name: "Default"
  mavenGlobalConfig:
    globalSettingsProvider: "standard"
    settingsProvider: "standard"

unclassified:
  location:
    adminAddress: "address not configured yet <nobody@nowhere>"
    url: "http://localhost:8080"

jobs:
  - script: |
      pipelineJob("build-and-upload") {
        parameters {
          stringParam(
            'projectName', 
            'canary', 
            'name of the project to build'
          )                  
        }
        definition {
          cps {
            script(
              new File('/var/jenkins_home/job-scripts/build-and-upload.groovy').text
            )
          }
        }
      }

  - script: |
      pipelineJob("deploy-app") {
        parameters {
          stringParam(
            'projectName', 
            'canary', 
            'name of the project to deploy'
          )                  
        }
        definition {
          cps {
            script(
              new File('/var/jenkins_home/job-scripts/deploy-app.groovy').text
            )
          }
        }
        triggers {
          upstream('build-and-upload', 'SUCCESS')
        }
      }
