jenkins:
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true
  crumbIssuer: "standard"
  disableRememberMe: false
  labelAtoms:
    - name: "built-in"
  log: {}
  markupFormatter: "plainText"
  mode: NORMAL
  nodeMonitors:
    - "architecture"
    - "clock"
    - diskSpace:
        freeSpaceThreshold: "1GiB"
        freeSpaceWarningThreshold: "2GiB"
    - "swapSpace"
    - tmpSpace:
        freeSpaceThreshold: "1GiB"
        freeSpaceWarningThreshold: "2GiB"
    - "responseTime"
  numExecutors: 2
  primaryView:
    all:
      name: "all"
  projectNamingStrategy: "standard"
  quietPeriod: 5
  remotingSecurity:
    enabled: true
  scmCheckoutRetryCount: 0
  securityRealm:
    local:
      allowsSignup: true
      users:
        - description: ""
          id: "admin"
          name: "Administrator"
          password: "3af23c474f6c4c6ebaca02e743433043"
          properties:
            - "apiToken"
            - "consoleUrlProvider"
            - "viewsTabBar"
            - myView:
                viewsTabBar: "standard"
            - "timezone"
            - "experimentalFlags"
        - description: ""
          id: "sofia.bernhard"
          name: "Sofia Bernhard"
          password: "sofia.bernhard123"
        - description: ""
          id: "michael.fateh"
          name: "Michael Fateh"
          password: "e38fce4d56c445d6910bab2b63a06d25166d5523ba9871d32744f3ea8d857eaa"
  slaveAgentPort: 50000
  updateCenter:
    sites:
      - id: "default"
        url: "https://updates.jenkins.io/update-center.json"
  views:
    - all:
        name: "all"
  viewsTabBar: "standard"

security:
  sSHD:
    port: 2222
  scriptApproval:
    approvedScriptHashes:
      - "SHA512:243ad5915f4831177784e157f42ca6706b4542c4c83272f224fda0c0dc7090c0bac56ec2c25d9db9846b97ef733f1e05e65563abb89ab8c46967698ed37df8ec"
      - "SHA512:243e519a0f3e1dcbfd4c71353c48caeee2d4e91fbcfb2905a8c225bdc24b564ec66fa9c57dee7653f2137f7946d602a42e7a6b0caee8a07664327737a965a842"
      - "SHA512:56d3d147fd3782b678483f85d67ae63e9039fbdff17b1638313548e704415291fe62e0ef5e1e423d1367ebad91cb968ae808921ebf3f5635c10af022258cab07"
      - "SHA512:57135e06746ac9894e24b7700a18594918e53c830737931f8654e48da3e8a0831728b346634e85be05ccf49cbf6aa4c16b767a73f22c57e60a281f532a2a736e"
