[project]
name = "garage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3[crt]>=1.43.9",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["**/*.py"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.13"
reportAny = false
reportIncompatibleVariableOverride = false
