server {
    listen 8081 default_server;
    listen [::]:8081 default_server;

    server_tokens off;

    # API — proxied to the Flask service on the loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Image gallery — autoindex listing of the rotating PNGs.
    location /images/ {
        alias /data/current/images/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_format html;
    }

    # Static frontend (QuoteVault site).
    location / {
        root /var/www/site;
        index index.html;
        # Allow extensionless URLs: /quotes -> /quotes.html
        try_files $uri $uri.html $uri/ =404;
    }
}
