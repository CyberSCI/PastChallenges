ftpd_banner=Welcome to the Library's FTP server! Currently restricted to internal use.
listen=YES
listen_ipv6=NO
anonymous_enable=YES
no_anon_password=YES
local_enable=YES
write_enable=YES
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
secure_chroot_dir=/var/run/vsftpd/empty
anon_root=/app
pam_service_name=vsftpd
